<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e463d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cantika">
<style>
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Cantika</title>
<style>
/* Layout: satu kolom lebar-ponsel di tengah, dikelilingi warna sage; header lengket di atas, bar aksi di bawah */
:root{
  --bg:#d7e6d0; --app:#f5f8f2; --card:#ffffff;
  --teal-900:#0e463d; --teal-700:#17695b; --teal-600:#1f7d6c;
  --gold:#d3a53f; --gold-ink:#7e611b;
  --ink:#19271f; --ink-soft:#586b60; --ink-faint:#93a79b;
  --line:#e3ece0;
  --hijau:#2f9e5b; --hijau-bg:#e4f4e9;
  --kuning:#e0a62c; --kuning-bg:#fbf1d8;
  --merah:#d8484a; --merah-bg:#fbe6e5;
  --shadow:0 6px 24px rgba(16,54,46,.10);
  --radius:18px;
  --fs-body:15px;
  --font-display:"Fraunces",Georgia,serif;
  --font-ui:"Plus Jakarta Sans",system-ui,sans-serif;
}
:root{ --ink-faint:#93a79b; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a1512; --app:#0f1d18; --card:#16251f;
  --teal-900:#0c3b34; --teal-700:#1d7868; --teal-600:#249079;
  --gold:#e4ba54; --gold-ink:#e4ba54;
  --ink:#e9f1ea; --ink-soft:#a3b7ad; --ink-faint:#7c9088;
  --line:#243b33;
  --hijau:#49b974; --hijau-bg:#143524;
  --kuning:#e9b94a; --kuning-bg:#3a2f12;
  --merah:#e9696b; --merah-bg:#3a1b1c;
  --shadow:0 6px 26px rgba(0,0,0,.42);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1512; --app:#0f1d18; --card:#16251f;
  --teal-900:#0c3b34; --teal-700:#1d7868; --teal-600:#249079;
  --gold:#e4ba54; --gold-ink:#e4ba54;
  --ink:#e9f1ea; --ink-soft:#a3b7ad; --ink-faint:#7c9088;
  --line:#243b33;
  --hijau:#49b974; --hijau-bg:#143524;
  --kuning:#e9b94a; --kuning-bg:#3a2f12;
  --merah:#e9696b; --merah-bg:#3a1b1c;
  --shadow:0 6px 26px rgba(0,0,0,.42);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-ui);font-size:var(--fs-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}

/* App shell */
.shell{
  max-width:468px;margin:0 auto;min-height:100%;
  background:var(--app);display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  box-shadow:0 0 50px rgba(16,54,46,.14);
}
@media(min-width:520px){ .shell{ margin-block:18px;min-height:calc(100% - 36px);border-radius:26px } }

/* Top bar */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--teal-900);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;
}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;color:#fff}
.brand .mark{width:30px;height:30px;flex:0 0 auto;object-fit:contain}
.brand .word{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.2px;line-height:1}
.brand .sub{font-size:10.5px;color:#bfe0d6;margin-top:2px;letter-spacing:.2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-petugas{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
  color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.btn-petugas:hover{background:rgba(255,255,255,.2)}
.btn-petugas svg{width:13px;height:13px}
.sim-tag{font-size:10px;color:#bfe0d6;letter-spacing:.3px}

/* View */
.view{flex:1;display:flex;flex-direction:column}
.pad{padding:18px 18px 26px}
.scroll{overflow-y:auto}

/* Back row */
.backrow{display:flex;align-items:center;gap:10px;padding:14px 16px 2px}
.back{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:grid;place-items:center;flex:0 0 auto;
}
.back svg{width:17px;height:17px}
.backrow h2{font-size:17px;margin:0;font-weight:700}

h1,h2,h3{text-wrap:balance}

/* Landing */
.hero{position:relative;padding:30px 22px 22px;display:flex;flex-direction:column;min-height:100%;
  background:
    radial-gradient(120% 70% at 80% 0%, color-mix(in srgb,var(--teal-600) 22%, transparent), transparent 60%),
    linear-gradient(180deg, var(--app), color-mix(in srgb,var(--teal-600) 10%, var(--app)));}
.hero-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.hero-logo .word{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--teal-700)}
.hero-art{position:relative;height:150px;margin:14px 0 4px}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:1.02;margin:12px 0 10px;letter-spacing:-.5px}
.hero h1 .accent{color:var(--teal-700)}
.hero p.lede{font-size:15.5px;color:var(--ink-soft);max-width:30ch;margin:0 0 auto}
.cta-big{
  margin-top:22px;width:100%;border:0;border-radius:16px;padding:16px 18px;
  background:var(--teal-900);color:#fff;font-weight:700;font-size:15.5px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);
}
.cta-big .chev{width:34px;height:34px;border-radius:50%;background:var(--teal-600);display:grid;place-items:center}
.cta-big .chev svg{width:16px;height:16px}
.powered{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:14px}

/* Services */
.greet{padding:4px 2px 14px}
.greet .k{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.greet h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:4px 0 0}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:10px;
  min-height:120px;box-shadow:var(--shadow);
}
.svc:hover{border-color:var(--teal-600)}
.svc .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--hijau-bg);color:var(--teal-700)}
.svc .ic svg{width:21px;height:21px}
.svc.alert .ic{background:var(--kuning-bg);color:var(--gold-ink)}
.svc .t{font-weight:700;font-size:14px;line-height:1.25}
.svc .d{font-size:11.5px;color:var(--ink-soft);margin-top:-4px}
.consult{
  margin-top:16px;border-radius:var(--radius);overflow:hidden;position:relative;
  background:linear-gradient(130deg,var(--teal-700),var(--teal-900));color:#fff;padding:20px 18px;
}
.consult h3{font-size:19px;margin:0 0 4px;font-weight:800;line-height:1.1}
.consult p{font-size:12.5px;color:#cfe7df;margin:0 0 14px}
.consult .daftar{background:var(--gold);color:#3a2d08;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}

/* Stepper */
.stepper{display:flex;align-items:center;padding:14px 16px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative}
.stepper .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:11px;color:var(--ink-faint);font-weight:700;z-index:2}
.stepper .st.done .dot{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.stepper .st.now .dot{background:var(--gold);border-color:var(--gold);color:#3a2d08}
.stepper .lab{font-size:10px;color:var(--ink-faint);font-weight:600}
.stepper .st.done .lab,.stepper .st.now .lab{color:var(--ink)}
.stepper .st:not(:last-child):after{content:"";position:absolute;top:13px;left:60%;right:-40%;height:2px;background:var(--line);z-index:1}
.stepper .st.done:not(:last-child):after{background:var(--teal-700)}

/* Forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;color:var(--ink);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal-600);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal-600) 18%,transparent)}
.field.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.row .field{margin:0}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button .s{font-size:10.5px;font-weight:500;color:var(--ink-faint)}
.seg button[aria-pressed="true"]{border-color:var(--teal-700);background:var(--hijau-bg);color:var(--teal-700)}
.seg button[aria-pressed="true"] .s{color:var(--teal-600)}
.checks{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.chk{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.chk input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--teal-700);flex:0 0 auto}
.chk .tx{font-size:13px}
.chk .tx small{display:block;color:var(--ink-faint);font-size:11px;margin-top:1px}
.hint{font-size:11.5px;color:var(--ink-faint);margin:2px 2px 0}

/* Primary bar button */
.barbtn{
  position:sticky;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,var(--app) 26%);
}
.btn-primary{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;background:var(--gold);color:#3a2d08;box-shadow:var(--shadow)}
.btn-primary.teal{background:var(--teal-900);color:#fff}
.btn-ghost{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:14px;background:var(--card);color:var(--teal-700);margin-top:10px}
.btn-primary:disabled{opacity:.5}

/* Quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.q .qn{font-size:11px;font-weight:700;color:var(--gold-ink);letter-spacing:.4px}
.q .qt{font-weight:700;font-size:14.5px;margin:4px 0 11px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;background:var(--app)}
.opt:last-child{margin-bottom:0}
.opt input{margin:2px 0 0;accent-color:var(--teal-700);flex:0 0 auto}
.opt .ot{font-size:13px}
.opt[data-sel="1"]{border-color:var(--teal-700);background:var(--hijau-bg)}

/* Surat cinta */
.surat-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.surat-card.blue{border-left-color:var(--teal-600)}
.surat-card.rose{border-left-color:var(--merah)}
.surat-card h4{display:flex;gap:8px;align-items:center;margin:0 0 9px;font-size:14.5px;color:var(--teal-700)}
.surat-card.rose h4{color:var(--merah)}
.surat-card p{margin:0 0 10px;font-size:13.5px;line-height:1.62;color:var(--ink)}
.surat-card p:last-child{margin-bottom:0}
.surat-card .em{background:var(--kuning-bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink)}
.surat-intro{font-family:var(--font-display);font-size:16px;color:var(--ink-soft);font-style:italic;text-align:center;margin:2px 10px 16px}

/* Result */
.triase-banner{border-radius:16px;padding:16px;display:flex;gap:13px;align-items:center;margin-bottom:14px}
.triase-banner .tb-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-weight:800;color:#fff;font-size:20px}
.triase-banner h3{margin:0 0 2px;font-size:18px}
.triase-banner p{margin:0;font-size:12.5px}
.tri-hijau{background:var(--hijau-bg)} .tri-hijau .tb-ic{background:var(--hijau)} .tri-hijau h3{color:var(--hijau)}
.tri-kuning{background:var(--kuning-bg)} .tri-kuning .tb-ic{background:var(--kuning)} .tri-kuning h3{color:var(--gold-ink)}
.tri-merah{background:var(--merah-bg)} .tri-merah .tb-ic{background:var(--merah)} .tri-merah h3{color:var(--merah)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 10px;font-size:14px}
.score-move{display:flex;align-items:center;gap:10px;font-weight:800;font-family:var(--font-display);font-size:26px}
.score-move .arrow{color:var(--ink-faint);font-size:20px}
.score-move .to{color:var(--teal-700)}
.rec{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:9px}
.rec:last-child{margin-bottom:0}
.rec .ck{width:20px;height:20px;border-radius:6px;background:var(--hijau);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.rec .ck svg{width:12px;height:12px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.legend .lg{display:flex;gap:9px;align-items:flex-start}
.legend .pz{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.codebox{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:4px}
.codebox b{font-family:var(--font-display);letter-spacing:.5px;color:var(--ink);font-size:14px}
.copybtn{background:none;border:1px dashed var(--line);border-radius:8px;padding:4px 9px;font-size:11px;color:var(--teal-700);margin-left:6px}

/* Timeline (PE tracker) */
.tl{position:relative;padding-left:6px}
.tl .node{display:flex;gap:13px;padding-bottom:18px;position:relative}
.tl .node:last-child{padding-bottom:0}
.tl .node:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl .node.done:not(:last-child):before{background:var(--teal-700)}
.tl .bullet{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:0 0 auto;display:grid;place-items:center;z-index:2}
.tl .bullet svg{width:12px;height:12px}
.tl .node.done .bullet{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.tl .node.active .bullet{background:var(--gold);border-color:var(--gold)}
.tl .node.active .bullet .pulse{width:8px;height:8px;border-radius:50%;background:#3a2d08}
.tl .tt{font-weight:700;font-size:13.5px}
.tl .node.active .tt{color:var(--gold-ink)}
.tl .ts{font-size:11.5px;color:var(--ink-faint)}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px}
.sp-proc{background:var(--kuning-bg);color:var(--gold-ink)}
.sp-done{background:var(--hijau-bg);color:var(--hijau)}

/* Edukasi */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--hijau-bg);border-color:var(--teal-700);color:var(--teal-700)}
.feat{border-radius:var(--radius);overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;margin-bottom:16px;box-shadow:var(--shadow);min-height:132px}
.feat .txt{background:var(--teal-700);color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:center}
.feat .txt .k{font-size:10px;letter-spacing:.6px;color:var(--gold);font-weight:700;text-transform:uppercase}
.feat .txt h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:6px 0 0;line-height:1.08}
.feat .art{background:linear-gradient(135deg,var(--hijau-bg),color-mix(in srgb,var(--gold) 26%,var(--card)));display:grid;place-items:center}
.feat .art svg{width:66px;height:66px;opacity:.85}
.art-list{display:flex;flex-direction:column;gap:11px}
.art-card{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--ink);align-items:center;box-shadow:var(--shadow)}
.art-card .thumb{width:58px;height:58px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;background:var(--hijau-bg);color:var(--teal-700)}
.art-card .thumb svg{width:28px;height:28px}
.art-card .cat{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--gold-ink)}
.art-card h4{margin:2px 0 2px;font-size:14px;line-height:1.2}
.art-card p{margin:0;font-size:11.5px;color:var(--ink-soft)}
.article h2{font-family:var(--font-display);font-weight:600;font-size:23px;margin:2px 0 4px;line-height:1.1}
.article .meta{font-size:11.5px;color:var(--gold-ink);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}
.article p{font-size:14px;line-height:1.65;margin:0 0 13px}
.article h3{font-size:15px;margin:18px 0 6px}
.article ul{margin:0 0 13px;padding-left:18px;font-size:14px;line-height:1.6}
.article li{margin-bottom:5px}

/* Petugas */
.petugas-top{background:linear-gradient(180deg,var(--teal-900),var(--teal-700));color:#fff;padding:16px 18px}
.petugas-top .r{display:flex;align-items:center;justify-content:space-between}
.petugas-top h2{margin:0;font-size:18px;font-weight:800}
.petugas-top p{margin:3px 0 0;font-size:11.5px;color:#cfe7df}
.logout{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}
.counts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0 6px}
.count{border-radius:14px;padding:13px;text-align:center}
.count .n{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1}
.count .l{font-size:11.5px;font-weight:700;margin-top:3px}
.count.m{background:var(--merah-bg)} .count.m .n,.count.m .l{color:var(--merah)}
.count.k{background:var(--kuning-bg)} .count.k .n,.count.k .l{color:var(--gold-ink)}
.count.h{background:var(--hijau-bg)} .count.h .n,.count.h .l{color:var(--hijau)}
.pcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px;text-align:left;color:var(--ink);width:100%;box-shadow:var(--shadow)}
.pcard.m{border-left-color:var(--merah)} .pcard.k{border-left-color:var(--kuning)} .pcard.h{border-left-color:var(--hijau)}
.pcard .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .nm{font-weight:700;font-size:15px}
.pcard .mt{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.pcard .sc{text-align:right;font-size:11px;color:var(--ink-faint);font-weight:600}
.pcard .sc b{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink)}
.pcard .sc .to{color:var(--teal-700)}
.pcard .note{font-size:12px;margin-top:8px;color:var(--ink-soft)}
.pcard .tag{display:inline-block;margin-top:9px;background:var(--kuning-bg);color:var(--gold-ink);font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px}
.pcard.new{outline:2px solid var(--gold);outline-offset:0}
.newflag{display:inline-block;background:var(--gold);color:#3a2d08;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.3px;margin-left:7px;vertical-align:middle}

/* Login */
.login-wrap{padding:26px 20px;display:flex;flex-direction:column;min-height:100%;justify-content:center;gap:4px}
.login-ic{width:60px;height:60px;border-radius:18px;background:var(--teal-900);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.login-ic svg{width:30px;height:30px}
.login-wrap h2{text-align:center;font-family:var(--font-display);font-weight:600;font-size:23px;margin:0 0 2px}
.login-wrap .sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 20px}

.login-logo{display:block;width:154px;max-width:72%;margin:0 auto 12px}
.ptabs{display:flex;gap:8px;margin-bottom:12px}
.ptabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:11px;padding:10px;font-weight:700;font-size:13px}
.ptabs button[aria-pressed="true"]{background:var(--teal-900);color:#fff;border-color:var(--teal-900)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal-900);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.note-sim{background:var(--kuning-bg);color:var(--gold-ink);border-radius:10px;padding:9px 12px;font-size:11.5px;margin-bottom:14px;display:flex;gap:7px;align-items:flex-start}
.note-sim svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const API = 'https://script.google.com/macros/s/AKfycbwDzov99_QbiII1hhPiMkyFueZkjUNYU0azm8HJxf_Yec-A5Rr7QtUxt27ZW79TmFp-/exec'; // <-- TEMPEL URL Web App Apps Script di sini (diakhiri /exec). Kosongkan = mode demo (data lokal).
function apiSend(action,data){ if(!API) return; try{ fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},data))}); }catch(e){} }
async function apiGet(params){ const u=API+'?'+new URLSearchParams(params).toString(); const r=await fetch(u); return await r.json(); }
async function loadPetugas(){ STATE.remoteLoading=true; try{ STATE.remote=await apiGet({action:'petugas'}); }catch(e){ STATE.remote={error:true}; } STATE.remoteLoading=false; render(); }
function triLabel(t){ return t==='h'?'Hijau':t==='k'?'Kuning':'Merah'; }
function laporTL(status){ const steps=[['diterima','Laporan diterima'],['verifikasi','Diverifikasi petugas'],['pe','PE/IKL dilaksanakan'],['selesai','Hasil & rekomendasi']]; let idx=steps.findIndex(s=>s[0]===status); if(idx<0) idx=0; return steps.map((s,i)=>[s[1], i<idx?'Selesai':(i===idx?'Sedang berjalan':'Menunggu'), i<idx?'done':(i===idx?'active':'')]); }

'sk-hasil':()=>{
  const r = SK.result;
  const tcls = r.tri==='h'?'tri-hijau':r.tri==='k'?'tri-kuning':'tri-merah';
  const tname = r.tri==='h'?'Triase Hijau':r.tri==='k'?'Triase Kuning':'Triase Merah';
  const tmsg = r.tri==='h'?'Pengetahuan baik & rumah aman. Pertahankan!'
            : r.tri==='k'?'Perlu perhatian. Rumah Anda dijadwalkan dicek petugas.'
            : 'Berisiko. Kunjungan rumah (IKL) diprioritaskan petugas.';
  const ticon = r.tri==='h'?'✓':'!';
  return backrow('Hasil Skrining','home')+skStepper(4)+`
  <div class="pad">
    <div class="panel" style="display:flex;gap:11px;align-items:center;margin-bottom:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--teal-700);color:#fff;display:grid;place-items:center;font-weight:700">${esc((SK.nama||'?').trim().charAt(0).toUpperCase()||'?')}</div>
      <div><div style="font-weight:700">${esc(SK.nama||'Peserta')}</div><div style="font-size:12px;color:var(--ink-soft)">${SK.tipe==='bumil'?'Ibu hamil':'Calon pengantin'}${SK.uk?' · '+esc(SK.uk)+' mgg':''} · ${esc(SK.desa)}</div></div>
    </div>
    <div class="triase-banner ${tcls}"><div class="tb-ic">${ticon}</div><div><h3>${tname}</h3><p>${tmsg}</p></div></div>

    <div class="panel"><h4>Nilai pengetahuan</h4>
      <div class="score-move"><span>${r.pre}</span><span class="arrow">→</span><span class="to">${r.post}</span></div>
      <p style="font-size:12px;color:var(--ink-soft);margin:8px 0 0">${r.delta>=0?'Naik '+r.delta:'Turun '+Math.abs(r.delta)} poin setelah membaca edukasi.</p>
    </div>

    <div class="panel"><h4>Dari mana hasil ini</h4>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 8px">Hasil akhir mengikuti tingkat yang <b>paling tinggi</b> di antara pengetahuan dan kondisi rumah.</p>
      <div style="font-size:12.5px;line-height:1.7">
        • Pengetahuan: <b>${r.post}</b> → ${badge(r.triKnow)}<br>
        • Faktor risiko rumah: <b>${r.riskCount}</b> faktor → ${badge(r.triRisk)}
      </div>
      ${r.riskList.length?`<div style="margin-top:10px;font-size:12px;color:var(--ink-soft)">Catatan rumah: ${r.riskList.map(esc).join('; ')}.</div>`:''}
    </div>

    <div class="panel"><h4>Yang bisa Anda lakukan</h4>
      ${r.recs.map(x=>`<div class="rec"><span class="ck">${I.check}</span><span>${x}</span></div>`).join('')}
    </div>

    <div class="panel"><h4>Arti warna triase</h4>
      <div class="legend">
        <div class="lg"><span class="pz" style="background:var(--hijau)"></span><div><b>Hijau</b> — skor ≥ 80 dan tanpa faktor risiko.</div></div>
        <div class="lg"><span class="pz" style="background:var(--kuning)"></span><div><b>Kuning</b> — skor 60–79 atau 1 faktor risiko. Dijadwalkan IKL.</div></div>
        <div class="lg"><span class="pz" style="background:var(--merah)"></span><div><b>Merah</b> — skor &lt; 60 atau ≥ 2 faktor risiko. IKL & konseling diprioritaskan.</div></div>
      </div>
    </div>

    <div class="codebox">Kode pelacakan Anda: <b id="cnt">${r.kode}</b><button class="copybtn" onclick="copyText('${r.kode}')">Salin</button></div>
  </div>
  <div class="barbtn">
    <button class="btn-primary teal" onclick="konsulFromSkrining()">Jadwalkan konsultasi di Puskesmas</button>
    <button class="btn-ghost" onclick="go('lapor')">Laporkan masalah lingkungan</button>
    <button class="btn-ghost" onclick="simpanWA()">${I.wa} &nbsp;Simpan hasil ke WhatsApp</button>
  </div>`;
},

    if(b[0]==='ul') return `<ul>${b[1].map(li=>`<li>${li}</li>`).join('')}</ul>`;

  const mine = STORE.skrining.map(s=>({nm:s.nama,tipe:(s.tipe==='bumil'?'Ibu hamil':'Calon pengantin')+(s.uk?' · '+s.uk+' mgg':''),desa:s.desa,pre:s.result.pre,post:s.result.post,tri:s.result.tri,note:s.result.riskList.length?s.result.riskList.join('; ')+'.':'Tidak ada faktor risiko rumah.',baru:true}));
  const useRemote = API && STATE.remote && !STATE.remote.error;
  const all = useRemote ? (STATE.remote.triase||[]) : [...mine,...SEED_PESERTA];
  const order={m:0,k:1,h:2};
  all.sort((a,b)=>order[a.tri]-order[b.tri] || (a.post-a.pre)-(b.post-b.pre));
  const cnt={m:0,k:0,h:0}; all.forEach(p=>cnt[p.tri]++);
  const konsul = useRemote ? (STATE.remote.konsultasi||[]) : [...STORE.konsultasi,...SEED_KONSUL];
  const tabs=`<div class="ptabs"><button aria-pressed="${STATE.pview!=='konsul'}" onclick="STATE.pview='triase';render()">Antrean Triase</button><button aria-pressed="${STATE.pview==='konsul'}" onclick="STATE.pview='konsul';render()">Jadwal Konsultasi</button></div>`;
  const header=`<div class="petugas-top"><div class="r"><div><h2>Dasbor Sanitarian</h2><p>Puskesmas Imogiri I${useRemote?'':' · data simulasi'}</p></div><button class="logout" onclick="STATE.petugas=false;STATE.remote=null;go('home')">Keluar</button></div></div>`;
  if(API && STATE.remote===null){ return header+'<div class="pad"><p class="hint" style="margin-top:22px;text-align:center">Memuat data dari server…</p></div>'; }
  if(STATE.pview==='konsul'){
    const dcard=(k)=>`<div class="pcard"><div class="ph"><div><div class="nm">${esc(k.nama)}${k.baru?'<span class="newflag">BARU</span>':''}</div><div class="mt">${esc(k.kategori)} · ${esc(k.desa)} · ${esc(k.mode)}</div></div><div class="sc">Antrean<b>#${k.antrean}</b></div></div><div class="note">${esc(k.masalah||'-')}</div></div>`;
    const grp=(hari)=>{const l=konsul.filter(x=>x.hari===hari);return `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px"><h3 style="margin:0;font-size:15px">${hari} <span style="font-weight:400;color:var(--ink-faint);font-size:12px">· ${hariDate(hari)}</span></h3><span style="font-size:12px;color:var(--ink-soft);font-weight:700">${l.length} orang</span></div>${l.length?l.map(dcard).join(''):'<p class="hint">Belum ada pendaftar.</p>'}</div>`;};
    return header+`<div class="pad" style="padding-top:12px">${tabs}${grp('Senin')}${grp('Kamis')}<p class="hint" style="margin-top:12px">Konfirmasi H-1 ke tiap pendaftar lewat WhatsApp.</p></div>`;
  }
  const F=STATE.pfilter;
  const show=all.filter(p=>F==='all'||p.tri===F);
  const chip=(key,l)=>`<button class="chip" aria-pressed="${F===key}" onclick="STATE.pfilter='${key}';render()">${l}</button>`;
  return header+`
  <div class="pad" style="padding-top:12px">
    ${tabs}
    <div class="counts">
      <div class="count m"><div class="n">${cnt.m}</div><div class="l">Merah</div></div>
      <div class="count k"><div class="n">${cnt.k}</div><div class="l">Kuning</div></div>
      <div class="count h"><div class="n">${cnt.h}</div><div class="l">Hijau</div></div>
    </div>
    <div class="chips">${chip('all','Semua')}${chip('m','Merah')}${chip('k','Kuning')}${chip('h','Hijau')}</div>
    ${show.map(p=>`
      <div class="pcard ${p.tri}${p.baru?' new':''}">
        <div class="ph">
          <div><div class="nm">${esc(p.nm)}${p.baru?'<span class="newflag">BARU</span>':''}</div><div class="mt">${esc(p.tipe)} · ${esc(p.desa)}</div></div>
          <div class="sc">Skor<b>${p.pre} <span class="to">→ ${p.post}</span></b></div>
        </div>
        <div class="note">${esc(p.note)}</div>
        ${p.tag?`<span class="tag">${esc(p.tag)}</span>`:''}
      </div>`).join('')}
    <p class="hint" style="margin-top:6px">Peserta baru dari skrining mandiri muncul di atas dengan penanda BARU.</p>
  </div>`;
}

};

/* ---------- Helpers tampilan ---------- */
function leafField(){
  return `<svg viewBox="0 0 320 150" width="100%" height="150" fill="none" aria-hidden="true">
    <g opacity=".9">
    <path d="M250 20c-30 2-52 22-56 52 30 2 54-18 58-50 0-2-1-2-2-2Z" fill="#2f9e5b" opacity=".7"/>
    <path d="M250 22c-22 10-38 28-44 48" stroke="#17695b" stroke-width="2"/>
    <path d="M290 60c-18 1-31 13-33 31 18 1 32-11 34-30 0-1 0-1-1-1Z" fill="#d3a53f" opacity=".75"/>
    <circle cx="60" cy="40" r="5" fill="#2f9e5b" opacity=".5"/>
    <circle cx="90" cy="70" r="3.5" fill="#d3a53f" opacity=".6"/>
    <path d="M40 110c-8 1-14 7-15 15 8 0 15-6 16-14 0 0 0-1-1-1Z" fill="#2f9e5b" opacity=".45"/>
    </g></svg>`;
}
function skStepper(step){
  const labs=['Pre-test','Surat Cinta','Post-test','Triase'];
  // step 0 = identitas (sebelum pre). Map: 0->none done; 1->pre now ...
  const map=[ -1, 0, 1, 2, 3 ]; // identitas,pre,surat,post,hasil
  const now=map[step];
  return `<div class="stepper">${labs.map((l,i)=>{
    const cls = i<now?'done': i===now?'now':'';
    return `<div class="st ${cls}"><div class="dot">${i<now?'✓':i+1}</div><div class="lab">${l}</div></div>`;
  }).join('')}</div>`;
}
function quizScreen(which){
  const title = which==='pre'?'Pre-test':'Post-test';
  const back = which==='pre'?'sk-identitas':'sk-surat';
  const ans = SK[which]||{};
  return backrow(title+' · Rumah Sehat & Stunting', back)+`
  <div class="pad">
    <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 14px">${which==='pre'?'Jawab sejujurnya dulu, nanti dibandingkan setelah membaca edukasi.':'Jawab lagi — lihat perubahan pengetahuan Anda.'}</p>
    ${QUIZ.map((q,qi)=>`
      <div class="q"><div class="qn">PERTANYAAN ${qi+1}/${QUIZ.length}</div><div class="qt">${q.q}</div>
      ${q.o.map((o,oi)=>`<label class="opt" data-sel="${ans[qi]===oi?1:0}"><input type="radio" name="${which}-${qi}" value="${oi}" ${ans[qi]===oi?'checked':''} onclick="pick('${which}',${qi},${oi})"><span class="ot">${o}</span></label>`).join('')}
      </div>`).join('')}
  </div>
  <div class="barbtn"><button class="btn-primary" id="quiz-next" onclick="finishQuiz('${which}')">${which==='pre'?'Lanjut: Surat Cinta dari Bayi':'Lihat Hasil Triase'} ${I.chev}</button></div>`;
}
function badge(t){ const m={h:['Hijau','var(--hijau)'],k:['Kuning','var(--gold-ink)'],m:['Merah','var(--merah)']}; return `<span style="color:${m[t][1]};font-weight:700">${m[t][0]}</span>`; }

/* ---------- Aksi skrining ---------- */
function startSkrining(){ SK={tipe:'catin',risiko:[],pre:{},post:{}}; go('sk-identitas'); }
function pick(which,qi,oi){ (SK[which]=SK[which]||{})[qi]=oi;
  document.querySelectorAll(`.q`).forEach(()=>{});
  // update selected styling tanpa full render
  const q = document.querySelectorAll('.q')[qi];
  if(q) q.querySelectorAll('.opt').forEach((el,i)=>el.setAttribute('data-sel', i===oi?1:0));
}
function saveIdentitas(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  SK.nama=g('f-nama'); SK.umur=g('f-umur'); SK.hp=g('f-hp'); SK.pad=g('f-pad');
  SK.desa=(document.getElementById('f-desa')||{}).value||DESA[0];
  if(SK.tipe==='bumil') SK.uk=g('f-uk');
  SK.risiko=[...document.querySelectorAll('.chk input:checked')].map(c=>c.value);
  if(!SK.nama){ toast('Isi nama dulu ya'); return; }
  go('sk-pretest');
}
function scoreQuiz(which){ let c=0; QUIZ.forEach((q,i)=>{ if((SK[which]||{})[i]===q.a) c++; }); return Math.round(c/QUIZ.length*100); }
function finishQuiz(which){
  const ans=SK[which]||{};
  if(Object.keys(ans).length<QUIZ.length){ toast('Masih ada pertanyaan kosong'); return; }
  if(which==='pre'){ go('sk-surat'); return; }
  computeResult(); go('sk-hasil');
}
function triFromScore(s){ return s>=80?'h':s>=60?'k':'m'; }
function triFromRisk(n){ return n===0?'h':n===1?'k':'m'; }
function worse(a,b){ const r={m:0,k:1,h:2}; return r[a]<r[b]?a:b; }
function computeResult(){
  const pre=scoreQuiz('pre'), post=scoreQuiz('post');
  const riskList=(SK.risiko||[]).map(k=>RISIKO.find(r=>r.k===k).t);
  const triKnow=triFromScore(post), triRisk=triFromRisk(SK.risiko.length);
  const tri=worse(triKnow,triRisk);
  const recs=[];
  if(SK.risiko.includes('air')||true) recs.push('Masak air sampai benar-benar mendidih sebelum diminum.');
  recs.push('Simpan air di wadah tertutup rapat.');
  if(tri==='h') recs.push('Pertahankan kondisi rumah; ikuti jadwal pemeriksaan rutin.');
  else recs.push('Tunggu kunjungan sanitarian untuk IKL (paling lambat 7 hari).');
  if(SK.risiko.includes('jamban')) recs.push('Rencanakan jamban sehat model leher angsa.');
  if(SK.risiko.includes('nyamuk')) recs.push('Terapkan 3M Plus untuk cegah DBD.');
  const kode=code('CNT');
  SK.result={pre,post,delta:post-pre,tri,triKnow,triRisk,riskCount:SK.risiko.length,riskList,recs,kode};
  STORE.skrining.unshift({nama:SK.nama,tipe:SK.tipe,uk:SK.uk,desa:SK.desa,result:SK.result,kode}); save();
  apiSend('skrining',{kode:kode,nama:SK.nama,tipe:SK.tipe,uk:SK.uk||'',umur:SK.umur||'',hp:SK.hp||'',desa:SK.desa,pad:SK.pad||'',pre:pre,post:post,triase:tri,riskCount:SK.risiko.length,riskList:riskList});
}
function simpanWA(){
  const r=SK.result;
  const txt=`CANTIKA — Hasil Skrining\nNama: ${SK.nama}\nTriase: ${r.tri==='h'?'HIJAU':r.tri==='k'?'KUNING':'MERAH'}\nNilai: ${r.pre} → ${r.post}\nKode: ${r.kode}`;
  copyText(txt); toast('Ringkasan disalin (simulasi WA)');
}

/* ---------- Lapor ---------- */
function kirimLapor(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const jenis=(document.getElementById('l-jenis')||{}).value||'Laporan';
  const desa=(document.getElementById('l-desa')||{}).value||DESA[0];
  const k=code('PBL');
  SK=SK||{}; SK.laporKode=k; SK.lookupKode=k;
  STORE.lapor[k]={jenis,desa,pad:g('l-pad'),status:'proc',
    tl:[['Laporan diterima','Baru saja','done'],['Diverifikasi petugas','Menunggu',''],['Dijadwalkan PE/IKL','Menunggu',''],['Hasil & rekomendasi','Menunggu','']]};
  apiSend('lapor',{kode:k,jenis:jenis,desa:desa,pad:g('l-pad'),deskripsi:g('l-desk'),hp:g('l-hp')});
  save(); go('lapor-sukses');
}
function cariKode(){
  const k=(document.getElementById('c-kode').value||'').trim().toUpperCase();
  if(!k){ toast('Masukkan kode'); return; }
  SK=SK||{};
  if(API){
    apiGet({action:'status',kode:k}).then(res=>{
      if(res && res.found){
        if(res.type==='lapor'){ SK.remoteLapor={jenis:res.jenis,desa:res.desa,pad:res.pad,status:res.status}; SK.lookupKode=k; go('cek-detail'); return; }
        if(res.type==='skrining'){ toast('Kode skrining — triase '+triLabel(res.triase)); return; }
        if(res.type==='konsultasi'){ toast('Konsultasi '+res.hari+' · antrean #'+res.antrean); return; }
        toast('Kode tidak ditemukan');
      } else { toast('Kode tidak ditemukan'); }
    }).catch(()=>{ cariKodeLokal(k); });
    return;
  }
  cariKodeLokal(k);
}
function cariKodeLokal(k){
  SK=SK||{}; SK.remoteLapor=null;
  if(STORE.lapor[k]||SEED_LAPOR[k]){ SK.lookupKode=k; go('cek-detail'); return; }
  const sk=STORE.skrining.find(s=>s.kode===k);
  if(sk){ toast('Kode skrining — triase '+triLabel(sk.result.tri)); return; }
  toast('Kode tidak ditemukan');
}

/* ---------- Edukasi ---------- */
function openArtikel(id){ STATE.artikel=id; go('artikel'); }

/* ---------- Konsultasi ---------- */
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function nextDate(dow){ const d=new Date(); let add=(dow-d.getDay()+7)%7; if(add===0) add=7; d.setDate(d.getDate()+add); return d; }
function hariDate(h){ const d=nextDate(h==='Senin'?1:4); return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear(); }
function openKonsultasi(){ SK=SK||{}; SK.konsul=SK.konsul||{mode:'Tatap muka',hari:'Senin'}; go('konsultasi'); }
function konsulFromSkrining(){ const r=SK.result; SK.konsul={mode:'Tatap muka',hari:'Senin',kat:(SK.tipe==='bumil'?'Ibu hamil':'Calon pengantin'),nama:SK.nama,umur:SK.umur,hp:SK.hp,desa:SK.desa,pad:SK.pad,masalah:'Tindak lanjut skrining — triase '+(r.tri==='h'?'Hijau':r.tri==='k'?'Kuning':'Merah')+(r.riskList.length?'; '+r.riskList.join('; '):'')}; go('konsultasi'); }
function setK(key,val){ SK.konsul[key]=val; render(); }
function kirimKonsultasi(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const k=SK.konsul;
  k.kat=(document.getElementById('k-kat')||{}).value||k.kat||'Umum / Keluarga';
  k.nama=g('k-nama'); k.umur=g('k-umur'); k.hp=g('k-hp'); k.pad=g('k-pad');
  k.desa=(document.getElementById('k-desa')||{}).value||DESA[0];
  k.masalah=g('k-masalah');
  if(!k.nama){ toast('Isi nama dulu ya'); return; }
  const existing=[...STORE.konsultasi,...SEED_KONSUL].filter(x=>x.hari===k.hari).length;
  const rec={nama:k.nama,kategori:k.kat,desa:k.desa,pad:k.pad,mode:k.mode,hari:k.hari,masalah:k.masalah,antrean:existing+1,kode:code('KSL'),tanggal:hariDate(k.hari),baru:true};
  STORE.konsultasi.unshift(rec); save();
  apiSend('konsultasi',{kode:rec.kode,nama:rec.nama,kategori:rec.kategori,umur:k.umur||'',hp:k.hp||'',desa:rec.desa,pad:rec.pad||'',masalah:rec.masalah,mode:rec.mode,hari:rec.hari,antrean:rec.antrean});
  SK.konsulDone=rec; go('konsultasi-sukses');
}
function simpanKonsulWA(){ const k=SK.konsulDone; copyText('CANTIKA — Jadwal Konsultasi\nNama: '+k.nama+'\nHari: '+k.hari+', '+k.tanggal+'\nAntrean: #'+k.antrean+'\nCara: '+k.mode+'\nKode: '+k.kode); toast('Ringkasan disalin (simulasi WA)'); }

/* ---------- util ---------- */
function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('Disalin'),()=>toast('Tersalin')); }catch(e){ toast('Tersalin'); } }
function bind(){}

try{document.getElementById('brandmark').src=IMG.iconLight;}catch(e){}
go('landing');
</script>
